# Minimal getting-started example: a single-instance, unsharded cluster with no
# credentials. This is the simplest runnable v2alpha1 cluster and the easiest way
# to verify the operator end to end (it does not require a vshard-enabled image).
#
#   kubectl apply -f db.tarantool.io_v2alpha1_minimal.yaml
#
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: minimal
spec:
  config: {}
  # failover defaults to "off"; a single instance comes up read-write on its own.
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: minimal-storage
spec:
  clusterName: minimal
  replicas: 1
  podTemplate:
    spec:
      containers:
        - name: tarantool
          image: tarantool/tarantool:3
          ports:
            - name: iproto
              containerPort: 3301
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
