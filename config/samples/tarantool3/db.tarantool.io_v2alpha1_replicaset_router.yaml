apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: router-001
spec:
  clusterName: example
  # Tarantool 3 configuration group; routers and storages are separate groups.
  group: routers
  replicas: 1
  config:
    sharding:
      roles: [router]
    # Optional application roles (Lua modules), e.g. the CRUD router:
    # roles:
    #   - roles.crud-router
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: tarantool
        app.kubernetes.io/component: router
    spec:
      containers:
        - name: tarantool
          image: tarantool/tarantool:3
          ports:
            - name: iproto
              containerPort: 3301
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
