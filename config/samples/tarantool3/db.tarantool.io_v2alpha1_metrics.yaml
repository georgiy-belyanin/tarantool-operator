# Tarantool 3 cluster with Prometheus metrics export.
#
# This shows the declarative way to expose instance metrics:
#   * the cluster-wide `metrics` section enables metric collection;
#   * the `roles.metrics-export` role serves them over HTTP in Prometheus format;
#   * a Service + ServiceMonitor scrape every instance pod on the metrics port.
#
# Image requirement: `roles.metrics-export` is NOT in the community
# `tarantool/tarantool:3` image (same as `vshard`) — use an image that bundles the
# metrics-export role. The config below is valid against the Tarantool 3 schema;
# the operator will render and deliver it, but instances will fail to start on an
# image without the role.
#
# The ServiceMonitor requires the Prometheus Operator CRDs to be installed.
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: metrics-demo
spec:
  # Cluster-wide config: failover + metric collection.
  config:
    replication:
      failover: election
    metrics:
      include: [all]
      labels:
        cluster: metrics-demo
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: metrics-demo-storage
spec:
  clusterName: metrics-demo
  replicas: 2
  # Enable the Prometheus HTTP exporter role and point it at a metrics port.
  config:
    roles:
      - roles.metrics-export
    roles_cfg:
      roles.metrics-export:
        http:
          - listen: "0.0.0.0:8081"
            endpoints:
              - path: /metrics/prometheus
                format: prometheus
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: tarantool
    spec:
      containers:
        - name: tarantool
          image: tarantool/tarantool:3 # replace with an image bundling roles.metrics-export
          ports:
            - name: iproto
              containerPort: 3301
            - name: metrics
              containerPort: 8081
---
# Service exposing the metrics port of every instance pod in the cluster. The
# operator stamps `tarantool.io/cluster: <cluster>` on instance pods.
apiVersion: v1
kind: Service
metadata:
  name: metrics-demo-metrics
  labels:
    tarantool.io/cluster: metrics-demo
spec:
  selector:
    tarantool.io/cluster: metrics-demo
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
---
# Scrape the metrics Service. Requires the Prometheus Operator.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics-demo
  labels:
    tarantool.io/cluster: metrics-demo
spec:
  selector:
    matchLabels:
      tarantool.io/cluster: metrics-demo
  endpoints:
    - port: metrics
      path: /metrics/prometheus
      interval: 15s
