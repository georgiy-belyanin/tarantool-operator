# Replicated, unsharded high-availability example using MANUAL failover. One
# replica set with three instances: the leader is pinned explicitly via the
# replica set's config.leader, the other two follow as read-only replicas. No
# vshard, so this runs on the stock tarantool/tarantool:3 image.
#
# Multi-instance replication needs a "replicator" user, so credentials are
# required here (unlike the single-instance minimal example).
#
# To let Tarantool elect the leader automatically instead, set
# config.replication.failover: election and drop config.leader on the ReplicaSet.
#
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: replicated
spec:
  credentialsSecret: replicated-tarantool-credentials
  config:
    credentials:
      users:
        replicator:
          roles: [replication]
    replication:
      # Pin the leader via the replica set's config.leader; switch to "election"
      # for Raft.
      failover: manual
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: replicated-storage
spec:
  clusterName: replicated
  replicas: 3
  config:
    # Must be one of this replica set's instance names (<rs>-<ordinal>).
    leader: replicated-storage-0
  podTemplate:
    spec:
      containers:
        - name: tarantool
          image: tarantool/tarantool:3
          ports:
            - name: iproto
              containerPort: 3301
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/tarantool
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
# Referenced by spec.credentialsSecret above (key = user name). Shown here for
# a runnable example only — manage real passwords with your secret tooling.
apiVersion: v1
kind: Secret
metadata:
  name: replicated-tarantool-credentials
type: Opaque
stringData:
  replicator: replicator-secret
