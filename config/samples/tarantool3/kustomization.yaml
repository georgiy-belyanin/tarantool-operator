# Prometheus metrics export (Service + ServiceMonitor; needs a metrics-export image).
- db.tarantool.io_v2alpha1_metrics.yaml
# Sharded cluster (router + storages) with election failover.
- db.tarantool.io_v2alpha1_cluster.yaml
- db.tarantool.io_v2alpha1_replicaset_router.yaml
- db.tarantool.io_v2alpha1_replicaset_storage.yaml
# Advanced: Lua app + application role + multiple replica sets/groups + Secrets + PVCs.
- db.tarantool.io_v2alpha1_advanced.yaml
