## Tarantool 3 samples (db.tarantool.io/v2alpha1 — the current API).
resources:
# Minimal single-instance cluster (simplest starting point).
- db.tarantool.io_v2alpha1_minimal.yaml
# Replicated, unsharded HA cluster with manual failover.
- db.tarantool.io_v2alpha1_replicated.yaml
