name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint the code
        # action v8 + golangci-lint v2: the v1.64.8 binary was built with go1.24
        # and refuses to target the module's go 1.25 ("Go language version used
        # to build golangci-lint is lower than the targeted Go version"); v2
        # binaries are built with go1.25+. .golangci.yml uses the v2 schema.
        uses: golangci/golangci-lint-action@v8
        with:
          args: -v --timeout 5m --config .golangci.yml
          version: v2.12.2
