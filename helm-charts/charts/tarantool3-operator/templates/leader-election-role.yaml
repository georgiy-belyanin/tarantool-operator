{{- if .Values.rbac.create }}
# Leader election (namespace-scoped): mirrors config/rbac/leader_election_role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tarantool3-operator.fullname" . }}-leader-election
  labels: {{- include "tarantool3-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tarantool3-operator.fullname" . }}-leader-election
  labels: {{- include "tarantool3-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tarantool3-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "tarantool3-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
