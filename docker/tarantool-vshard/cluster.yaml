# Local sharded demo cluster for the tarantool-vshard image: one router and two
# 2-instance storage replica sets, manual failover (deterministic local
# bootstrap — the operator pins <rs>-0 as leader). Passwords come from the
# demo-creds Secret (key = user name); users/roles are plain Tarantool config.
apiVersion: v1
kind: Secret
metadata:
  name: demo-creds
type: Opaque
stringData:
  replicator: replicator-secret
  storage: storage-secret
  admin: admin-secret
---
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: demo
spec:
  credentialsSecret: demo-creds
  config:
    credentials:
      users:
        replicator:
          roles: [replication]
        storage:
          roles: [sharding]
        # "super" lets the operator observe leaders, hot-reload config and run
        # schema upgrades over iproto — and gives YOU an iproto login to play with.
        admin:
          roles: [super]
    replication:
      failover: manual
    sharding:
      bucket_count: 3000
    memtx:
      memory: 134217728 # 128 MiB per instance
    log:
      level: 5
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: router-a
spec:
  clusterName: demo
  group: routers
  replicas: 1
  config:
    sharding:
      roles: [router]
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool-vshard:3
        ports:
        - name: iproto
          containerPort: 3301
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: storage-a
spec:
  clusterName: demo
  group: storages
  replicas: 2
  config:
    sharding:
      roles: [storage]
      weight: 1
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool-vshard:3
        ports:
        - name: iproto
          containerPort: 3301
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: storage-b
spec:
  clusterName: demo
  group: storages
  replicas: 2
  config:
    sharding:
      roles: [storage]
      weight: 1
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool-vshard:3
        ports:
        - name: iproto
          containerPort: 3301
