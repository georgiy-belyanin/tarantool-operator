version: "2"
run:
  go: "1.25"
linters:
  default: all
  disable:
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupword
    - err113
    - exhaustruct
    - fatcontext
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - godot
    - godox
    - iface
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - mnd
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - testpackage
    - usetesting
    - varnamelen
    - wastedassign
    - wrapcheck
    - wsl
    # Deprecated since v2.12 (replaced by gomodguard_v2, which default:all enables).
    - gomodguard
    # New in golangci-lint v2 — style-only; disabled to match the policy above
    # (wsl/nlreturn/perfsprint/... were already off in the v1 config).
    - wsl_v5
    - funcorder
    - modernize
    - noinlineerr
    - embeddedstructfieldcheck
  settings:
    staticcheck:
      # Defaults plus: ST1001 (dot imports — pervasive in the legacy cartridge
      # packages; the v1 config disabled stylecheck for exactly this) and the QF
      # quickfix suggestions (style-only refactors in legacy code).
      checks:
        - all
        - -ST1000
        - -ST1001
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1007
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forcetypeassert
        path: test/cartridge/mocks/(.+)\.go
      - linters:
          - gosec
        path: test/cartridge/utils/(.+)\.go
      - linters:
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - gosec
        path: pkg/cartridge/
        text: G115
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
