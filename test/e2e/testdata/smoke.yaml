# Minimal Tarantool 3 cluster for the kind smoke test: one unsharded replicaset
# with a single instance. Keeps the test deterministic — no replication,
# election quorum, credentials, or vshard image requirements.
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: e2e
spec: {}
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: e2e-rs
spec:
  clusterName: e2e
  replicas: 1
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool/tarantool:3
        ports:
        - name: iproto
          containerPort: 3301
