# Config hot-reload e2e fixture (F2). A 3-instance election replica set with a
# "super" credential user — which lets the operator reload dynamic config changes
# over iproto (config:reload) instead of rolling the pods. Initial passthrough
# config sets memtx.memory and log.level (both dynamic box.cfg options); the test
# changes them and asserts they go live on every instance with NO pod restart.
apiVersion: v1
kind: Secret
metadata:
  name: rel-creds
type: Opaque
stringData:
  replicator: r-secret
  admin: a-secret
---
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: rel
spec:
  credentialsSecret: rel-creds
  config:
    credentials:
      users:
        replicator:
          roles: [replication]
        admin:
          roles: [super]
    memtx:
      memory: 268435456
    log:
      level: 5
    replication:
      failover: election
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: rel-rs
spec:
  clusterName: rel
  replicas: 3
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool/tarantool:3
        ports:
        - name: iproto
          containerPort: 3301
