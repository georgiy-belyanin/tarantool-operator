# Persistence e2e fixture: a SINGLE-instance replica set on a PersistentVolume.
# One instance on purpose — with no replication to resync from, every data
# assertion proves recovery from the volume itself (snapshot load + WAL
# replay), not a copy from a peer. The test later scales to 3 and back to
# exercise the expel / stale-volume round trip.
#
# No super user is declared: the operator's built-in user (provisioned by
# default) drives the iproto operations, so this suite also covers hot,
# reload-driven scale-in.
apiVersion: v1
kind: Secret
metadata:
  name: persist-creds
type: Opaque
stringData:
  replicator: r-secret
---
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: persist
spec:
  credentialsSecret: persist-creds
  config:
    credentials:
      users:
        replicator:
          roles: [replication]
    replication:
      failover: manual
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: persist-rs
spec:
  clusterName: persist
  replicas: 1
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool/tarantool:3
        ports:
        - name: iproto
          containerPort: 3301
        volumeMounts:
        - name: data
          mountPath: "/var/lib/tarantool"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 256Mi
  config:
    leader: persist-rs-0
