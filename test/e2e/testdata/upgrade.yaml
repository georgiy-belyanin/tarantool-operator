# Binary-upgrade e2e fixture (F9): a 3-instance election replica set on
# tarantool 3.6 with persistent storage and a super user (needed for the
# operator's post-rollout box.schema.upgrade()). The test patches the image to
# 3.7 and asserts the rollout + schema-upgrade orchestration.
apiVersion: v1
kind: Secret
metadata:
  name: up-creds
type: Opaque
stringData:
  replicator: r-secret
  admin: a-secret
---
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: up
spec:
  credentialsSecret: up-creds
  config:
    credentials:
      users:
        replicator:
          roles: [replication]
        admin:
          roles: [super]
    memtx:
      memory: 67108864
    log:
      level: 4
    replication:
      failover: election
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: up-rs
spec:
  clusterName: up
  replicas: 3
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool/tarantool:3.6
        ports:
        - name: iproto
          containerPort: 3301
        volumeMounts:
        - name: data
          mountPath: "/var/lib/tarantool"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 256Mi
