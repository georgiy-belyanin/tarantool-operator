# Rolling-update e2e fixture: a 3-instance election replica set on tarantool
# 3.6 with persistent storage, a replication user and a super user (the
# operator's schema upgrade + leader step-down need them). The test preloads a
# synchronous space, patches the image to 3.7 and asserts zero read downtime
# and zero acknowledged-write loss while the set rolls one instance at a time.
apiVersion: v1
kind: Secret
metadata:
  name: roll-creds
type: Opaque
stringData:
  replicator: r-secret
  admin: a-secret
---
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: roll
spec:
  credentialsSecret: roll-creds
  config:
    credentials:
      users:
        replicator:
          roles: [replication]
        admin:
          roles: [super]
    memtx:
      memory: 134217728
    log:
      level: 4
    replication:
      failover: election
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: roll-rs
spec:
  clusterName: roll
  replicas: 3
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool/tarantool:3.6
        ports:
        - name: iproto
          containerPort: 3301
        volumeMounts:
        - name: data
          mountPath: "/var/lib/tarantool"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 256Mi
