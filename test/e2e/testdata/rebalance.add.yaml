# The third storage replica set, added mid-test to trigger vshard rebalancing.
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: storage-c
spec:
  clusterName: shard
  group: storages
  replicas: 1
  config:
    sharding:
      roles: [storage]
      weight: 1
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool-vshard:3
        imagePullPolicy: IfNotPresent
        ports:
        - name: iproto
          containerPort: 3301
