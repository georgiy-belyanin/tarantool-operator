# User-application e2e fixture: a single instance that loads a user Lua app via
# Tarantool 3's `app.file`. The app code is supplied from a ConfigMap mounted at
# /app and selected through spec.config.app.file (passthrough config). This shows
# the operator running arbitrary user logic inside the cluster, not just the DB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
data:
  init.lua: |
    -- User application, loaded by Tarantool 3 via app.file.
    rawset(_G, 'e2e_app_loaded', true)

    -- A trivial user function (compute logic).
    function _G.e2e_sum(a, b)
        return a + b
    end

    -- Data-plane user logic: idempotently create a space and seed a row.
    -- Called by the e2e once the instance is writable.
    function _G.e2e_seed()
        if box.space.items == nil then
            local s = box.schema.space.create('items')
            s:format({{name = 'id', type = 'unsigned'}, {name = 'name', type = 'string'}})
            s:create_index('pk', {parts = {'id'}})
        end
        box.space.items:replace({1, 'widget'})
        return box.space.items:get(1)[2]
    end
---
apiVersion: db.tarantool.io/v2alpha1
kind: Cluster
metadata:
  name: app
spec:
  config:
    app:
      file: "/app/init.lua"
---
apiVersion: db.tarantool.io/v2alpha1
kind: ReplicaSet
metadata:
  name: app-rs
spec:
  clusterName: app
  replicas: 1
  podTemplate:
    spec:
      containers:
      - name: tarantool
        image: tarantool/tarantool:3
        ports:
        - name: iproto
          containerPort: 3301
        volumeMounts:
        - name: app-code
          mountPath: "/app"
      volumes:
      - name: app-code
        configMap:
          name: app-code
